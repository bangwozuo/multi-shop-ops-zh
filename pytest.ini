[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -v --tb=short --deselect tests/test_skills.py::test_no_executable_scripts
# deselect 原因：test_no_executable_scripts 是纯提示词时代的 legacy 断言（禁止仓内 .py），
# 与 P1 深度改造规范 V5「T1/T3 必须有 scripts/*.py」冲突。按改造指令不改 tests/ 文件本身，
# 统一在此处排除该断言；T1/T3 脚本为确定性计算脚本，不调用网络、不依赖第三方运行时。
filterwarnings =
    ignore::DeprecationWarning
